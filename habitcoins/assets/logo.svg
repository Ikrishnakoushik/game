<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Main gradient: purple to deep purple -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#8B7CF8"/>
      <stop offset="100%" stop-color="#4834D4"/>
    </linearGradient>

    <!-- Coin shine gradient -->
    <linearGradient id="coinGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%"   stop-color="#FDCB6E"/>
      <stop offset="50%"  stop-color="#F9A825"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>

    <!-- Coin inner gradient -->
    <linearGradient id="coinInner" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%"   stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFAB00"/>
    </linearGradient>

    <!-- Shine overlay -->
    <radialGradient id="shine" cx="35%" cy="30%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#2D1B8E" flood-opacity="0.45"/>
    </filter>

    <!-- Coin shadow -->
    <filter id="coinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- App icon rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)"/>

  <!-- Subtle background pattern: concentric rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.07"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.07"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.07"/>

  <!-- Coin body (outer ring) -->
  <circle cx="256" cy="248" r="148" fill="url(#coinGrad)" filter="url(#coinShadow)"/>

  <!-- Coin rim detail -->
  <circle cx="256" cy="248" r="148" fill="none" stroke="#E65100" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Coin inner face -->
  <circle cx="256" cy="248" r="124" fill="url(#coinInner)"/>

  <!-- Coin inner ring detail -->
  <circle cx="256" cy="248" r="124" fill="none" stroke="#F9A825" stroke-width="2.5" stroke-opacity="0.6"/>

  <!-- Karma infinity symbol on coin -->
  <!-- Left loop of infinity -->
  <path d="
    M 256 248
    C 256 220, 228 200, 208 210
    C 188 220, 182 244, 196 260
    C 210 276, 236 272, 256 248
    Z
  " fill="none" stroke="#4834D4" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right loop of infinity -->
  <path d="
    M 256 248
    C 256 220, 284 200, 304 210
    C 324 220, 330 244, 316 260
    C 302 276, 276 272, 256 248
    Z
  " fill="none" stroke="#4834D4" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center dot of infinity -->
  <circle cx="256" cy="248" r="10" fill="#4834D4"/>

  <!-- Coin shine overlay -->
  <circle cx="256" cy="248" r="148" fill="url(#shine)"/>

  <!-- Small sparkle top-right of coin -->
  <g transform="translate(368, 138)" fill="#ffffff" opacity="0.9">
    <polygon points="0,-10 2.5,-2.5 10,0 2.5,2.5 0,10 -2.5,2.5 -10,0 -2.5,-2.5" />
  </g>

  <!-- Small sparkle bottom-left -->
  <g transform="translate(148, 358)" fill="#FFE082" opacity="0.7">
    <polygon points="0,-7 1.75,-1.75 7,0 1.75,1.75 0,7 -1.75,1.75 -7,0 -1.75,-1.75" />
  </g>

  <!-- App name text: "KARMA" -->
  <text
    x="256" y="438"
    font-family="'Arial Rounded MT Bold', 'Helvetica Rounded', Arial, sans-serif"
    font-size="58"
    font-weight="900"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="6"
    opacity="0.95"
  >KARMA</text>

  <!-- App name text: "COINS" in amber -->
  <text
    x="256" y="488"
    font-family="'Arial Rounded MT Bold', 'Helvetica Rounded', Arial, sans-serif"
    font-size="36"
    font-weight="700"
    fill="#FDCB6E"
    text-anchor="middle"
    letter-spacing="10"
    opacity="0.95"
  >COINS</text>
</svg>
