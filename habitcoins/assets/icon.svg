<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#8B7CF8"/>
      <stop offset="100%" stop-color="#4834D4"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%"   stop-color="#FDCB6E"/>
      <stop offset="50%"  stop-color="#F9A825"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="coinInner" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%"   stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFAB00"/>
    </linearGradient>
    <radialGradient id="shine" cx="35%" cy="30%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="coinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)"/>

  <!-- Background rings -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.08"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.08"/>

  <!-- Coin outer -->
  <circle cx="256" cy="256" r="168" fill="url(#coinGrad)" filter="url(#coinShadow)"/>
  <circle cx="256" cy="256" r="168" fill="none" stroke="#E65100" stroke-width="3" stroke-opacity="0.35"/>

  <!-- Coin inner face -->
  <circle cx="256" cy="256" r="140" fill="url(#coinInner)"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#F9A825" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Infinity / karma symbol — left loop -->
  <path d="
    M 256 256
    C 256 224, 224 200, 200 212
    C 176 224, 170 252, 186 270
    C 202 288, 232 284, 256 256
    Z
  " fill="none" stroke="#4834D4" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Infinity / karma symbol — right loop -->
  <path d="
    M 256 256
    C 256 224, 288 200, 312 212
    C 336 224, 342 252, 326 270
    C 310 288, 280 284, 256 256
    Z
  " fill="none" stroke="#4834D4" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center dot -->
  <circle cx="256" cy="256" r="12" fill="#4834D4"/>

  <!-- Shine -->
  <circle cx="256" cy="256" r="168" fill="url(#shine)"/>

  <!-- Sparkle top-right -->
  <g transform="translate(390, 130)" fill="#ffffff" opacity="0.9">
    <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3"/>
  </g>

  <!-- Sparkle bottom-left -->
  <g transform="translate(128, 382)" fill="#FFE082" opacity="0.75">
    <polygon points="0,-8 2,-2 8,0 2,2 0,8 -2,2 -8,0 -2,-2"/>
  </g>
</svg>
